<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FantasticGame - Premium Color Prediction & Arcade Gaming</title>
    <!-- Google Identity Services script for instant Google Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      /* Hide all Netlify injected badges, watermarks, drawer containers and feedback widgets */
      .netlify-badge,
      [data-netlify-badge],
      #netlify-badge,
      a[href*="netlify.com"],
      div[class*="netlify"],
      iframe[src*="netlify"],
      div[data-netlify-identity-menu],
      .netlify-drawer,
      #netlify-drawer-container {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
        position: absolute !important;
        z-index: -99999 !important;
        left: -99999px !important;
      }
    </style>
    <script>
      (function() {
        function removeNetlify() {
          var badElements = document.querySelectorAll(
            '.netlify-badge, [data-netlify-badge], #netlify-badge, a[href*="netlify.com"], div[class*="netlify-badge"], iframe[src*="netlify"], #netlify-drawer-container'
          );
          for (var i = 0; i < badElements.length; i++) {
            badElements[i].remove();
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', removeNetlify);
        } else {
          removeNetlify();
        }
        var obs = new MutationObserver(removeNetlify);
        window.addEventListener('load', function() {
          obs.observe(document.body, { childList: true, subtree: true });
        });
      })();
    </script>
  </head>
  <body class="bg-[#0b0f19] text-gray-100 antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
