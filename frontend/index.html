<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FantasticGame - Premium Color Prediction & Arcade Gaming</title>
    <!-- Google Identity Services script for instant Google Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      /* Hide all Netlify injected badges, watermarks, drawer containers and feedback widgets */
      netlify-drawer,
      #netlify-drawer,
      .netlify-drawer,
      .netlify-badge,
      [data-netlify-badge],
      #netlify-badge,
      a[href*="netlify.com"],
      div[class*="netlify"],
      iframe[src*="netlify"],
      iframe[title*="Netlify"],
      div[data-netlify-identity-menu],
      #netlify-drawer-container {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        height: 0px !important;
        width: 0px !important;
        position: absolute !important;
        z-index: -999999 !important;
        left: -99999px !important;
        transform: scale(0) !important;
      }
    </style>
    <script>
      (function() {
        function purgeNetlify() {
          // 1. Tag and class based removal
          var bad = document.querySelectorAll(
            'netlify-drawer, #netlify-drawer, .netlify-drawer, .netlify-badge, [data-netlify-badge], #netlify-badge, a[href*="netlify.com"], div[class*="netlify-badge"], iframe[src*="netlify"], #netlify-drawer-container'
          );
          for (var i = 0; i < bad.length; i++) {
            bad[i].remove();
          }

          // 2. Scan elements containing "Powered by Netlify"
          var elements = document.querySelectorAll('div, a, span, p, netlify-drawer');
          for (var j = 0; j < elements.length; j++) {
            var el = elements[j];
            if (el.textContent && el.textContent.indexOf('Powered by Netlify') !== -1) {
              var target = el.closest('div[style*="fixed"], div[style*="position"], netlify-drawer') || el;
              target.style.display = 'none';
              try { target.remove(); } catch(e){}
            }
          }
        }

        purgeNetlify();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', purgeNetlify);
        }
        window.addEventListener('load', purgeNetlify);
        setInterval(purgeNetlify, 300);

        var obs = new MutationObserver(purgeNetlify);
        window.addEventListener('load', function() {
          obs.observe(document.body, { childList: true, subtree: true });
        });
      })();
    </script>
  </head>
  <body class="bg-[#0b0f19] text-gray-100 antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
